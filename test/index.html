<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Tests – DMI Diploma in English</title>
<link rel="icon" href="../assets/dmi-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.tc{appearance:none;font:inherit;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px;cursor:pointer;color:var(--ink)}
.tc b{display:block;font-size:17px}
.tc span{font-size:13px;color:var(--muted)}
.tc.on{border-color:var(--ink);background:var(--y)}
.tc.on span{color:var(--ink)}
.rules{font-size:14.5px;padding-left:20px;margin:8px 0 0}
.err{color:var(--bad);font-weight:700;font-size:14px;margin-top:10px;min-height:20px}
.stick{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;border-bottom:4px solid var(--y)}
.stick .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:14px}
.stick .who{flex:1;min-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{background:var(--y);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:18px;font-variant-numeric:tabular-nums}
.timer.low{background:#ff5a4d;color:#fff}
.sec{margin:22px 0 10px;padding:10px 14px;background:var(--ink);color:#fff;border-radius:10px;font-weight:800}
.sec small{display:block;font-weight:600;color:var(--y);font-size:12.5px}
.qq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.qq.miss{border-color:var(--bad);box-shadow:0 0 0 2px var(--badbg)}
.qq .t{font-size:17px;margin:0 0 4px}
.qq .clue{font-size:14.5px;color:var(--muted);margin:0 0 6px}
.qq .t b{background:var(--y2);padding:0 4px;border-radius:4px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ops label{margin:0;display:flex;gap:8px;align-items:center;border:1.5px solid #bdb9aa;border-radius:10px;padding:10px 12px;font-size:15.5px;font-weight:600;cursor:pointer}
.ops input{accent-color:#141414;width:18px;height:18px;flex:none}
.ops label:has(input:checked){background:var(--y);border-color:var(--ink)}
@media(max-width:560px){.ops{grid-template-columns:1fr}}
.nosel{user-select:none;-webkit-user-select:none}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.confirm .card{max-width:420px;width:100%}
.slip{max-width:560px;margin:0 auto;border:2px solid var(--ink)}
.slip .hd{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
.slip .hd img{height:56px}
.score{font-size:64px;font-weight:800;line-height:1;text-align:center;margin:10px 0 0}
.score small{font-size:22px;color:var(--muted)}
.grade{text-align:center;font-weight:800;margin:6px 0 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv span{color:var(--muted)}
table.br{width:100%;border-collapse:collapse;margin-top:14px;font-size:14.5px}
table.br td,table.br th{border:1px solid var(--line);padding:7px 9px;text-align:left}
table.br td:last-child,table.br th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;background:var(--okbg);color:var(--ok)}
.status.warn{background:#fff3cd;color:#6b4e00}
@media print{.top,.foot,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="top" id="top"><div class="in">
  <a href="../"><img src="../assets/dmi-logo.png" alt="DMI Computer Education – home"></a>
  <div><small>DIPLOMA IN ENGLISH</small><h1>Vocabulary Tests</h1></div>
  <nav><a href="../practice/">Practice</a><a class="on" href="./">Tests</a></nav>
</div></header>

<div id="app"></div>

<footer class="foot" id="foot"><b>DMI Computer Education</b> · Since 2008 · Quality education creates bright future.</footer>
<script src="../assets/config.js"></script>
<script src="../assets/words.js"></script>
<script>
(function(){
var W=window.DMI_WORDS,C=window.DMI_CONFIG,app=document.getElementById('app');
var $=function(i){return document.getElementById(i)};
var S={test:null,name:'',reg:'',branch:'',qs:[],ans:{},start:0,left:0,tick:null,done:false};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function first(s){return s==='Was / Were'?s:s.split('/')[0].trim()}
function irregular(o){var v=first(o.f[0]).toLowerCase(),w=o.w.toLowerCase();return !/ed$/.test(v)||v===w}
function segs(t){return t.split('/').map(function(x){return x.replace(/\(.*?\)/g,'').trim()})}
function differ(a,b){if(a.w===b.w)return false;var A=segs(a.ta),B=segs(b.ta);for(var i=0;i<A.length;i++)if(B.indexOf(A[i])>-1)return false;return true}
function pick3(o,pool){var r=[];shuffle(pool).forEach(function(x){if(r.length<3&&differ(o,x)&&r.every(function(y){return differ(x,y)}))r.push(x)});return r}
function nforms(o){var u=[];[o.w,first(o.f[0]),first(o.f[1]),o.f[2],o.f[3]].forEach(function(x){if(u.indexOf(x)<0)u.push(x)});return u.length}

/* ---------- build a 50-question paper: 10 words from each of the 5 pages ---------- */
function build(test){
  var pool=W.filter(function(o){return test.pages.indexOf(o.p)>-1}),A=[],B=[],Cq=[],D=[];
  test.pages.forEach(function(p){
    var sh=shuffle(pool.filter(function(o){return o.p===p}));
    var irr=sh.filter(function(o){return irregular(o)&&nforms(o)>=4}),c=irr.slice(0,3);
    if(c.length<3)c=c.concat(sh.filter(function(o){return c.indexOf(o)<0&&nforms(o)>=4}).slice(0,3-c.length));
    var rest=sh.filter(function(o){return c.indexOf(o)<0});
    rest.slice(0,3).forEach(function(o){A.push({sec:'A',w:o.w,t:'What is the Tamil meaning of <b>'+esc(o.w)+'</b>?',a:o.ta,ta:true,
      opts:shuffle([o.ta].concat(pick3(o,pool).map(function(x){return x.ta})))})});
    rest.slice(3,5).forEach(function(o){B.push({sec:'B',w:o.w,t:'Which English word means <b class="ta">'+esc(o.ta)+'</b>?',a:o.w,
      opts:shuffle([o.w].concat(pick3(o,pool).map(function(x){return x.w})))})});
    c.forEach(function(o){
      var v2=first(o.f[0]),v3=first(o.f[1]),irrg=irregular(o),k,label,a;
      if(irrg){k=(v2!==v3&&Math.random()<.5)?1:0}else{k=Math.random()<.5?0:3}
      a=k===3?o.f[3]:(k===1?v3:v2);
      label=k===0?'the past tense (V2)':k===1?'the past participle (V3)':'the -ing form';
      var cand=[v2,v3,o.f[3],o.f[2],o.w],opts=[a];
      cand.forEach(function(x){if(opts.length<4&&opts.indexOf(x)<0)opts.push(x)});
      Cq.push({sec:'C',w:o.w,t:'Choose '+label+' of <b>'+esc(o.w)+'</b>.',a:a,opts:shuffle(opts)})});
    rest.slice(5,7).forEach(function(o){
      var all=[o.w,first(o.f[0]),first(o.f[1]),o.f[2],o.f[3]],bl=o.b.toLowerCase(),idx=0;
      for(var fi=3;fi>=0;fi--)o.f[fi].split('/').forEach(function(x){if(x.trim().toLowerCase()===bl)idx=fi+1});
      if(o.w.toLowerCase()===bl)idx=0;
      var re=new RegExp('(^|[^A-Za-z-])'+o.b.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')+'(?![A-Za-z-])','i');
      var m=o.en.match(re),shown=m?m[0].slice(m[1].length):o.b,cap=shown.charAt(0)===shown.charAt(0).toUpperCase()&&o.en.indexOf(shown)===0;
      function cs(x){x=x.toLowerCase();return cap?x.charAt(0).toUpperCase()+x.slice(1):x}
      var correct=cs(shown);
      var ds=pick3(o,pool).map(function(x){var f=[x.w,first(x.f[0]),first(x.f[1]),x.f[2],x.f[3]][idx];return cs(f.split(' / ')[0])});
      D.push({sec:'D',w:o.w,t:esc(o.en).replace(esc(shown),'<b>&nbsp;________&nbsp;</b>'),clue:o.tas,a:correct,opts:shuffle([correct].concat(ds))})});
  });
  return shuffle(A).concat(shuffle(B),shuffle(Cq),shuffle(D));
}
var SECS={A:['Section A — Tamil meaning','Choose the correct Tamil meaning of the English word.'],
          B:['Section B — English word','Choose the English word for the Tamil meaning.'],
          C:['Section C — Verb forms','Choose the correct form of the verb.'],
          D:['Section D — Complete the sentence','Choose the word that completes the sentence. The Tamil sentence is given to help you.']};

/* ---------- screen 1: student details ---------- */
function home(){
  document.body.classList.remove('nosel');$('top').style.display='';$('foot').style.display='';
  app.innerHTML='<main class="wrap"><div class="card"><h2>Vocabulary Test</h2><p class="muted" style="margin:0">Diploma in English · Do it yourself book · 100 marks</p>'+
  '<label>1. Choose your test</label><div class="tests" id="tests">'+C.TESTS.map(function(t){
    return '<button type="button" class="tc" data-id="'+t.id+'" aria-pressed="false"><b>'+esc(t.name)+'</b><span>Book pages '+t.pages[0]+' – '+t.pages[t.pages.length-1]+'</span></button>'}).join('')+'</div>'+
  '<label for="nm">2. Full name</label><input type="text" id="nm" autocomplete="name" maxlength="80" placeholder="Your full name">'+
  '<label for="rg">3. Registration number</label><input type="text" id="rg" autocomplete="off" maxlength="30" placeholder="Your DMI registration number">'+
  '<label for="br">4. Branch</label><select id="br"><option value="">Select your branch</option>'+C.BRANCHES.map(function(b){return '<option>'+esc(b)+'</option>'}).join('')+'</select>'+
  '<label>Before you start</label><ul class="rules"><li>50 questions · 2 marks each · <b>100 marks</b></li><li>Time allowed: <b>'+C.TEST_MINUTES+' minutes</b>. The test is submitted automatically when the time ends.</li><li>10 questions come from each of the 5 pages. Study the pages in the <a href="../practice/">Practice Hub</a> first.</li><li>Do not refresh or close the page during the test.</li></ul>'+
  '<div class="err" id="err" role="alert"></div><button class="btn pri" id="go" style="width:100%;font-size:17px">Start the test</button></div></main>';
  $('tests').onclick=function(e){var b=e.target.closest('.tc');if(!b)return;S.test=C.TESTS.filter(function(t){return t.id==b.dataset.id})[0];
    Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('on',c===b);c.setAttribute('aria-pressed',c===b)})};
  $('go').onclick=function(){
    S.name=$('nm').value.trim().replace(/\s+/g,' ');S.reg=$('rg').value.trim();S.branch=$('br').value;
    var e=!S.test?'Please choose a test.':S.name.length<3?'Please enter your full name.':!S.reg?'Please enter your registration number.':!S.branch?'Please select your branch.':'';
    $('err').textContent=e;if(e)return;start()};
}

/* ---------- screen 2: the paper ---------- */
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function start(){
  S.qs=build(S.test);S.ans={};S.done=false;S.start=Date.now();S.left=C.TEST_MINUTES*60;
  $('top').style.display='none';$('foot').style.display='none';document.body.classList.add('nosel');
  var h='<div class="stick"><div class="in"><span class="who">'+esc(S.test.name)+' · '+esc(S.name)+' ('+esc(S.reg)+')</span><span id="cnt">0 / '+S.qs.length+' answered</span><span class="timer" id="tm" aria-label="Time left">'+fmt(S.left)+'</span></div></div><main class="wrap">',last='';
  S.qs.forEach(function(q,i){
    if(q.sec!==last){last=q.sec;h+='<div class="sec">'+SECS[q.sec][0]+'<small>'+SECS[q.sec][1]+' (2 marks each)</small></div>'}
    h+='<fieldset class="qq" id="q'+i+'" style="margin-left:0;margin-right:0"><legend class="t" style="float:left;width:100%;padding:0">'+(i+1)+'. '+q.t+'</legend>'+(q.clue?'<p class="clue ta" style="clear:both">'+esc(q.clue)+'</p>':'')+
      '<div class="ops" style="clear:both">'+q.opts.map(function(o,k){return '<label'+(q.ta?' class="ta"':'')+'><input type="radio" name="q'+i+'" value="'+k+'"><span>'+esc(o)+'</span></label>'}).join('')+'</div></fieldset>'});
  h+='<div class="err" id="err2" role="alert"></div><button class="btn pri" id="sub" style="width:100%;font-size:17px;margin-top:8px">Submit the test</button></main><div id="cf"></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  app.onchange=function(e){var r=e.target;if(r.type!=='radio')return;var i=+r.name.slice(1);S.ans[i]=+r.value;$('q'+i).classList.remove('miss');
    $('cnt').textContent=Object.keys(S.ans).length+' / '+S.qs.length+' answered'};
  $('sub').onclick=askSubmit;
  S.tick=setInterval(function(){S.left=Math.max(0,C.TEST_MINUTES*60-Math.floor((Date.now()-S.start)/1000));var t=$('tm');if(!t)return;
    t.textContent=fmt(S.left);t.classList.toggle('low',S.left<=300);if(S.left<=0)finish(true)},500);
}
function askSubmit(){
  var miss=[];S.qs.forEach(function(q,i){var m=S.ans[i]===undefined;$('q'+i).classList.toggle('miss',m);if(m)miss.push(i)});
  $('cf').innerHTML='<div class="confirm" role="dialog" aria-modal="true" aria-labelledby="cft"><div class="card"><h2 id="cft" style="font-size:20px">Submit your test?</h2><p>'+
    (miss.length?'You have <b>'+miss.length+' unanswered</b> question'+(miss.length>1?'s':'')+' (marked in red). Unanswered questions get 0 marks.':'You have answered all the questions.')+
    ' You cannot change your answers after submitting.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="cfb">'+(miss.length?'Go back and answer':'Go back')+'</button><button class="btn pri" id="cfy">Yes, submit</button></div></div></div>';
  $('cfb').onclick=function(){$('cf').innerHTML='';if(miss.length)$('q'+miss[0]).scrollIntoView({block:'center'})};
  $('cfy').onclick=function(){finish(false)};$('cfb').focus();
}

/* ---------- screen 3: result ---------- */
function finish(auto){
  if(S.done)return;S.done=true;clearInterval(S.tick);
  var sec={A:[0,0],B:[0,0],C:[0,0],D:[0,0]},wrong=[];
  S.qs.forEach(function(q,i){sec[q.sec][1]+=2;if(S.ans[i]!==undefined&&q.opts[S.ans[i]]===q.a)sec[q.sec][0]+=2;else wrong.push(q.sec+':'+q.w)});
  var total=sec.A[0]+sec.B[0]+sec.C[0]+sec.D[0],used=Math.min(C.TEST_MINUTES*60,Math.floor((Date.now()-S.start)/1000));
  var grade=total>=75?'Distinction':total>=65?'Merit':total>=50?'Pass':'Not yet passed — practise and try again';
  var now=new Date(),rec={test:S.test.name,pages:S.test.pages[0]+'-'+S.test.pages[S.test.pages.length-1],name:S.name,reg:S.reg,branch:S.branch,marks:total,
    a:sec.A[0],b:sec.B[0],c:sec.C[0],d:sec.D[0],answered:Object.keys(S.ans).length,minutes:Math.round(used/6)/10,auto:auto?'Yes':'No',grade:grade,wrong:wrong.join(', '),when:now.toISOString()};
  try{var L=JSON.parse(localStorage.getItem('dmi_vocab_results')||'[]');L.push(rec);localStorage.setItem('dmi_vocab_results',JSON.stringify(L.slice(-50)))}catch(e){}
  document.body.classList.remove('nosel');$('top').style.display='';$('foot').style.display='';
  app.innerHTML='<main class="wrap"><div class="card slip"><div class="hd"><img src="../assets/dmi-logo.png" alt="DMI Computer Education"><div><b>DMI Computer Education</b><br><span class="muted">Diploma in English · '+esc(S.test.name)+' (pages '+rec.pages+')</span></div></div>'+
    '<div class="kv"><span>Name</span><b>'+esc(S.name)+'</b><span>Reg. No.</span><b>'+esc(S.reg)+'</b><span>Branch</span><b>'+esc(S.branch)+'</b><span>Date</span><b>'+now.toLocaleDateString('en-GB')+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</b></div>'+
    '<div class="score">'+total+'<small> / 100</small></div><div class="grade">'+grade+'</div>'+
    '<table class="br"><tr><th>Section</th><th>Marks</th></tr>'+['A','B','C','D'].map(function(k){return '<tr><td>'+SECS[k][0].replace('Section '+k+' — ','')+'</td><td>'+sec[k][0]+' / '+sec[k][1]+'</td></tr>'}).join('')+'</table>'+
    (auto?'<p class="muted" style="font-size:13.5px">Time ended — the test was submitted automatically.</p>':'')+
    '<div class="status warn" id="st">Saving your marks…</div>'+
    '<div class="noprint" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="pr">Print result</button><a class="btn pri" href="../practice/" style="text-decoration:none">Back to practice</a><button class="btn dark" id="nw">Finish</button></div></div></main>';
  window.scrollTo(0,0);
  $('pr').onclick=function(){window.print()};$('nw').onclick=function(){S.test=null;home()};
  var st=$('st');
  if(!C.RESULTS_URL){st.textContent='Please show this result to your teacher before closing the page.';return}
  fetch(C.RESULTS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)})
    .then(function(){st.className='status';st.textContent='✓ Your marks have been sent to DMI.'})
    .catch(function(){st.textContent='Your marks could not be sent (no internet). Please show this result to your teacher.'});
}
document.addEventListener('contextmenu',function(e){if(document.body.classList.contains('nosel'))e.preventDefault()});
document.addEventListener('copy',function(e){if(document.body.classList.contains('nosel'))e.preventDefault()});
home();
})();
</script>
</body>
</html>
